  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full px-screen-margin-mobile bg-surface"><div class="flex flex-col w-full pb-8">
<!-- Minimal App Logo / Brand Box Placeholder -->
<div class="pt-6 pb-4 flex flex-col items-center justify-center">
<div class="w-14 h-14 rounded-2xl bg-surface-container-low flex items-center justify-center text-primary mb-3">
<span class="material-symbols-outlined text-3xl">auto_stories</span>
</div>
<span class="font-label-md text-label-md text-outline uppercase tracking-wider">Homework Organizer</span>
</div>
<!-- Welcoming Header -->
<div class="text-center px-2 mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight">Bem-vindo de volta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Organize seus deveres e tarefas escolares</p>
</div>
<!-- Decorative Student Companion Visual Highlight -->
<div class="mb-6 rounded-2xl bg-surface-container-low p-card-padding-md flex items-center gap-3.5">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-xl">event_available</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-title-sm text-title-sm text-on-surface truncate">Sua semana acadêmica organizada</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Acompanhe prazos e conquiste suas metas de estudo.</span>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col w-full gap-4" id="login-form" onsubmit="event.preventDefault(); handleLogin();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email-input">E-mail escolar ou pessoal</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none">mail</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline rounded-xl pl-11 pr-4 outline-none transition-colors focus:bg-surface-container" id="email-input" placeholder="seu.email@escola.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password-input">Senha</label>
<button class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors py-1" type="button">
          Esqueceu a senha?
        </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none">lock</span>
<input class="w-full h-12 bg-surface-container-low text-on-surface font-body-md text-body-md placeholder:text-outline rounded-xl pl-11 pr-12 outline-none transition-colors focus:bg-surface-container" id="password-input" placeholder="••••••••" required="" type="password"/>
<button aria-label="Alternar visualização da senha" class="absolute right-1 w-11 h-11 flex items-center justify-center text-outline hover:text-on-surface transition-colors" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Option -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input class="hidden peer" id="remember-checkbox" type="checkbox"/>
<div class="w-5 h-5 rounded-lg bg-surface-container-low peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-sm opacity-0 peer-checked:opacity-100 transition-opacity font-bold">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Lembrar de mim</span>
</label>
</div>
<!-- Main Submit Action Button -->
<div class="pt-3">
<button class="w-full h-12 bg-primary-container text-on-primary font-title-sm text-title-sm rounded-xl flex items-center justify-center gap-2 active:bg-primary transition-all duration-150 shadow-none" id="submit-button" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider & Secondary Social Quick Actions -->
<div class="relative my-7 flex items-center justify-center">
<div class="w-full h-px bg-surface-container"></div>
<span class="absolute bg-surface px-3 font-label-sm text-label-sm text-outline uppercase tracking-wider">ou acesse com</span>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="h-11 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-2 font-body-sm text-body-sm transition-colors" type="button">
<span class="material-symbols-outlined text-lg text-error">school</span>
<span>Google Sala de Aula</span>
</button>
<button class="h-11 rounded-xl bg-surface-container-low hover:bg-surface-container text-on-surface flex items-center justify-center gap-2 font-body-sm text-body-sm transition-colors" type="button">
<span class="material-symbols-outlined text-lg text-primary">domain</span>
<span>Conta Institucional</span>
</button>
</div>
<!-- Registration Redirection Link -->
<div class="mt-8 text-center flex items-center justify-center gap-1.5">
<span class="font-body-sm text-body-sm text-on-surface-variant">Ainda não tem uma conta?</span>
<button class="font-title-sm text-title-sm text-primary hover:text-primary-container transition-colors" type="button">
      Criar conta
    </button>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const eyeIcon = document.getElementById('eye-icon');

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();

  function handleLogin() {
    const submitBtn = document.getElementById('submit-button');
    if (!submitBtn) return;
    
    const originalContent = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
      <span>Entrando...</span>
    `;

    setTimeout(() => {
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined text-xl">done</span>
        <span>Conectado!</span>
      `;
      submitBtn.classList.remove('bg-primary-container');
      submitBtn.classList.add('bg-secondary');
    }, 1200);
  }
</script></main></body></html>
